---  # apache-rocky.yml

- hosts: rocky

  tasks:

    - name: Install Apache
      dnf:
        name: httpd

    - name: Start & enable Apache
      service:
        name: httpd
        state: started
        enabled: true

    - name: Install custom web page
      copy:
        dest: /var/www/html/index.html
        mode: 0644
        content: |
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Rocky</title>
            </head>
            <body>
              <h1>Rocky -- My first Ansible-managed website</h1>
            </body>
          </html>